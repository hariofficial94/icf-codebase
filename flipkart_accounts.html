<!--
  Flipkart settlements on the Accounts page (13 Nov 2026). Pulled in by accounts.html with
  <?!= include('flipkart_accounts'); ?> near the end of <body>.
  Flipkart pays monthly, in one payout for many orders. Accounts ticks the orders a payout
  covers, enters its UTR and date, and those orders are settled (closed). Server side: FollowUps.js.
-->
<style>
  .side-panel.fk-acc { border-left: 4px solid #2874f0; }
  .fk-acc .fk-count { display: none; min-width: 16px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: #2874f0; color: #fff; font-size: 10px; text-align: center; vertical-align: middle; }
  .fk-acc .fk-sum { font-size: 12px; color: #555; margin-bottom: 8px; }
  .fk-row { display: flex; gap: 8px; align-items: flex-start; padding: 7px 8px; border: 1px solid #e0e0e0; border-radius: 4px; margin-bottom: 6px; background: #fafafa; font-size: 12px; }
  .fk-row.old { border-color: #f0c98a; background: #fff8ec; }
  .fk-row input { width: auto; margin: 2px 0 0; }
  .fk-row .fk-main { flex: 1; min-width: 0; }
  .fk-row .fk-inst { font-size: 13px; font-weight: 600; color: #1F3864; }
  .fk-row .fk-sub { color: #777; margin-top: 2px; }
  .fk-row .fk-val { font-weight: 700; white-space: nowrap; }
  .fk-pay { display: none; margin-top: 8px; padding: 8px; border: 1px solid #c7d8f7; border-radius: 4px; background: #f3f7fe; }
  .fk-pay.show { display: block; }
  .fk-pay input { width: 100%; padding: 6px 8px; font-size: 12.5px; border: 1px solid #ccc; border-radius: 4px; margin: 3px 0 6px; box-sizing: border-box; }
  .fk-acc button.fk-btn { width: auto; margin: 0; padding: 5px 12px; font-size: 12px; font-weight: 700; border-radius: 4px; cursor: pointer; border: none; background: #2874f0; color: #fff; }
  .fk-acc button.fk-btn:disabled { background: #ccc; cursor: not-allowed; }
  .fk-acc .fk-msg { font-size: 12px; margin-top: 5px; color: #B00020; }
  .fk-acc .fk-ok { font-size: 12px; margin-top: 5px; color: #2c7a2c; }
</style>

<script>
(function () {
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function inr(n) { return '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }
  function todayYmd() { var d = new Date(Date.now() + 19800000); return d.toISOString().slice(0, 10); }

  var panel = document.createElement('div');
  panel.className = 'side-panel fk-acc';
  panel.innerHTML =
    '<div class="side-panel-header"><h3>Flipkart settlements<span class="fk-count" id="fkAccCount">0</span></h3>' +
    '<button class="refresh-btn" id="fkAccRefresh" type="button">&#8635; Refresh</button></div>' +
    '<div class="field-hint" style="margin-top:0; margin-bottom:8px;">Flipkart orders not yet matched to a Flipkart payout. When the monthly payout arrives, tick the orders it covers (Flipkart’s settlement report lists them), enter the UTR and date, and save. That closes them.</div>' +
    '<div id="fkAccSum" class="fk-sum"></div>' +
    '<div id="fkAccList" class="pending-empty">Loading...</div>' +
    '<div class="fk-pay" id="fkPay">' +
      '<b id="fkPicked">0 orders ticked</b>' +
      '<input type="text" id="fkUtr" placeholder="Payout UTR / bank reference">' +
      '<input type="date" id="fkDate" title="Date the payout reached the bank">' +
      '<input type="text" id="fkAmt" placeholder="Payout amount (optional, after Flipkart’s fees)">' +
      '<input type="text" id="fkNote" placeholder="Note (optional)">' +
      '<button type="button" class="fk-btn" id="fkSave">Mark ticked orders settled</button>' +
      '<div class="fk-msg" id="fkMsg"></div></div>' +
    '<div class="fk-ok" id="fkOk"></div>';
  // Left column, after the refunds pane (falls back to the right column if the layout changes).
  var leftCol = document.querySelector('.left-col') || document.querySelector('.side-col');
  if (leftCol) leftCol.insertBefore(panel, leftCol.children[2] || null);
  var list = document.getElementById('fkAccList');
  document.getElementById('fkDate').max = todayYmd();

  function picked() { return Array.prototype.map.call(list.querySelectorAll('.fk-chk:checked'), function (c) { return c.value; }); }
  function syncPay() {
    var p = picked(), sum = 0;
    Array.prototype.forEach.call(list.querySelectorAll('.fk-chk:checked'), function (c) { sum += Number(c.getAttribute('data-v')) || 0; });
    document.getElementById('fkPicked').textContent = p.length + ' order' + (p.length === 1 ? '' : 's') + ' ticked – ' + inr(sum) + ' sale value';
    document.getElementById('fkPay').classList.toggle('show', p.length > 0);
  }

  function render(r) {
    var items = (r && r.items) || [];
    var badge = document.getElementById('fkAccCount');
    var handed = items.filter(function (i) { return i.handedOver; });
    badge.textContent = handed.length; badge.style.display = handed.length ? 'inline-block' : 'none';
    document.getElementById('fkAccSum').textContent = items.length ? items.length + ' unsettled – ' + inr(r.total) + ' sale value (' + handed.length + ' handed over to Flipkart)' : '';
    if (!items.length) { list.className = 'pending-empty'; list.textContent = 'Every Flipkart order is settled.'; syncPay(); return; }
    list.className = '';
    list.innerHTML = items.map(function (i) {
      var old = i.daysSinceHandover !== null && i.daysSinceHandover > 45;
      return '<label class="fk-row' + (old ? ' old' : '') + '">' +
        '<input type="checkbox" class="fk-chk" value="' + esc(i.trackerId) + '" data-v="' + (Number(i.value) || 0) + '"' + (i.handedOver ? '' : ' disabled title="Not handed over to Flipkart yet"') + '>' +
        '<span class="fk-main"><span class="fk-inst">' + esc(i.institution) + '</span><div class="fk-sub">' + esc(i.trackerId) + ' &middot; ' +
          (i.handedOver ? 'handed over ' + esc(i.handedOver) + (i.daysSinceHandover !== null ? ' (' + i.daysSinceHandover + ' days ago)' : '') : 'not handed over yet') +
          (i.deliveryStatus ? ' &middot; ' + esc(i.deliveryStatus) : '') + '</div></span>' +
        '<span class="fk-val">' + inr(i.value) + '</span></label>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.fk-chk'), function (c) { c.addEventListener('change', syncPay); });
    syncPay();
  }

  document.getElementById('fkSave').addEventListener('click', function () {
    var ids = picked(), btn = this, msg = document.getElementById('fkMsg');
    var utr = document.getElementById('fkUtr').value.trim(), date = document.getElementById('fkDate').value;
    msg.textContent = '';
    if (!ids.length) { msg.textContent = 'Tick the orders the payout covers.'; return; }
    if (utr.length < 6) { msg.textContent = 'Enter the payout UTR.'; return; }
    if (!date) { msg.textContent = 'Enter the date the payout reached the bank.'; return; }
    if (!window.confirm('Mark ' + ids.length + ' Flipkart order' + (ids.length === 1 ? '' : 's') + ' as settled with UTR ' + utr + '?')) return;
    btn.disabled = true; btn.textContent = 'Saving...';
    authRun()
      .withSuccessHandler(function (r) {
        btn.disabled = false; btn.textContent = 'Mark ticked orders settled';
        ['fkUtr', 'fkAmt', 'fkNote'].forEach(function (id) { document.getElementById(id).value = ''; });
        document.getElementById('fkOk').textContent = r.settled + ' order' + (r.settled === 1 ? '' : 's') + ' settled.';
        setTimeout(function () { document.getElementById('fkOk').textContent = ''; }, 6000);
        load();
      })
      .withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Mark ticked orders settled'; msg.textContent = 'Error: ' + e.message; })
      .markFlipkartSettled({ trackerIds: ids, utr: utr, payoutDate: date, payoutAmount: document.getElementById('fkAmt').value.trim(), note: document.getElementById('fkNote').value.trim() });
  });

  function load() {
    authRun()
      .withSuccessHandler(render)
      .withFailureHandler(function () { list.className = 'pending-empty'; list.textContent = 'Could not load Flipkart orders.'; })
      .getFlipkartSettlements();
  }
  document.getElementById('fkAccRefresh').addEventListener('click', load);
  var prevClear = window.ICF_CLEAR, prevReload = window.ICF_RELOAD;
  window.ICF_CLEAR = function () { if (typeof prevClear === 'function') prevClear(); list.className = 'pending-empty'; list.textContent = 'Loading...'; document.getElementById('fkAccCount').style.display = 'none'; document.getElementById('fkPay').classList.remove('show'); };
  window.ICF_RELOAD = function () { if (typeof prevReload === 'function') prevReload(); load(); };
  load();
})();
</script>
