<!--
  CRE induction on the CRE page (Nov 2026). Pulled in by cre_beta.html with
  <?!= include('induction_cre'); ?> after orders_cre, as the last line before </body>.
  Only shows for a CRE who is in induction (server: Induction.gs):
    - a welcome screen on first sign-in, which they must acknowledge;
    - an "Induction" button on the rail and an Induction view: day X of 60,
      the checklist by week, the assessment card, the day-60 checkpoint;
    - the timed assessment itself, full screen, with autosave;
    - training videos (Nov 2026): Greeshma's unlisted YouTube videos, played in a
      pop-up. Every CRE gets the library (rail button "Training" if they aren't
      in induction); the page reports seconds actually played, and 90% = watched.
  The correct answers never come to this page -- scoring is on the server.
-->
<style>
  .ind-hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-bottom: 22px; }
  .ind-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .ind-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .ind-card .ind-sub { font-size: 12.5px; color: var(--text-2); }
  .ind-big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ind-big small { font-size: 15px; font-weight: 500; color: var(--text-2); margin-left: 4px; }
  .ind-line { position: relative; height: 8px; border-radius: 4px; background: var(--surface-3); margin: 18px 0 26px; }
  .ind-line .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--leaf-grad); }
  .ind-line .mk { position: absolute; top: -5px; width: 2px; height: 18px; background: var(--text-3); }
  .ind-line .mk span { position: absolute; top: 21px; transform: translateX(-50%); font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .ind-line .mk.end span { transform: translateX(-100%); }
  .ind-line .mk.start span { transform: none; }
  .ind-bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
  .ind-bar > div { height: 100%; background: var(--leaf-grad); }
  .ind-bar.red > div { background: var(--red); }
  .ind-bar.amber > div { background: var(--amber); }
  .ind-stats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 4px; font-size: 12.5px; color: var(--text-2); }
  .ind-stats b { color: var(--text); font-size: 15px; display: block; }
  .ind-test .btn { margin-top: 14px; }
  .ind-secs { margin-top: 12px; display: grid; gap: 8px; }
  .ind-sec { font-size: 12.5px; }
  .ind-sec .row { display: flex; justify-content: space-between; gap: 8px; }
  .ind-attempts { margin-top: 10px; font-size: 12px; color: var(--text-2); }
  .ind-rev { margin-bottom: 22px; }
  .ind-week { margin-bottom: 18px; }
  .ind-week h4 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
  .ind-week h4 .now { color: var(--leaf-ink); }
  .ind-phase { font-size: 18px; font-weight: 600; margin: 26px 0 12px; }
  .ind-phase span { font-size: 13px; font-weight: 500; color: var(--text-2); margin-left: 6px; }
  .ind-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 6px; }
  .ind-item.done { opacity: 0.72; }
  .ind-item.done .ind-t { text-decoration: line-through; text-decoration-color: var(--text-3); }
  .ind-item.revise { border-color: var(--amber-bd); }
  .ind-tick { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border-2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; margin-top: 1px; }
  .ind-tick:hover { border-color: var(--leaf); }
  .ind-tick.on { background: var(--leaf-grad); border-color: transparent; color: var(--on-leaf); }
  .ind-tick.wait { border-color: var(--amber); color: var(--amber); }
  .ind-tick:disabled { cursor: default; }
  .ind-tick svg { width: 14px; height: 14px; }
  .ind-t { font-weight: 600; font-size: 13.5px; }
  .ind-w { font-size: 12.5px; color: var(--text-2); margin-top: 3px; line-height: 1.5; }
  .ind-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .ind-meta a { font-size: 12px; font-weight: 600; }

  /* Welcome + test: full screen, above the page, below the sign-in screen */
  .ind-full { position: fixed; inset: 0; z-index: 4500; background: var(--bg); overflow-y: auto; display: none; }
  .ind-full.show { display: block; }
  .ind-wel { max-width: 720px; margin: 0 auto; padding: 56px 24px 64px; }
  .ind-wel .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--leaf-ink); }
  .ind-wel h1 { font-size: 32px; letter-spacing: -0.02em; margin: 8px 0 10px; }
  .ind-wel p { color: var(--text-2); font-size: 14.5px; line-height: 1.65; }
  .ind-wel .phases { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px 0; }
  .ind-wel .ph { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .ind-wel .ph b { display: block; font-size: 14px; margin-bottom: 4px; }
  .ind-wel .ph .d { font-size: 11.5px; font-weight: 700; color: var(--leaf-ink); letter-spacing: 0.04em; text-transform: uppercase; }
  .ind-wel .ph ul { margin: 8px 0 0; padding-left: 18px; color: var(--text-2); font-size: 13px; line-height: 1.6; }
  .ind-wel .rule { border: 1px solid var(--amber-bd); background: var(--amber-bg); border-radius: 12px; padding: 16px 18px; margin: 18px 0; }
  .ind-wel .rule b { color: var(--amber); }
  .ind-wel .rule ul { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.65; color: var(--text); }

  .ind-tbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: var(--bg-2); border-bottom: 1px solid var(--border); }
  .ind-tbar .ttl { font-weight: 600; flex: 1 1 auto; min-width: 0; }
  .ind-tbar .ttl small { display: block; font-weight: 500; font-size: 12px; color: var(--text-2); }
  .ind-timer { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 12px; border-radius: 8px; background: var(--surface-2); }
  .ind-timer.warn { color: var(--amber); background: var(--amber-bg); }
  .ind-timer.crit { color: var(--red); background: var(--red-bg); }
  .ind-qs { max-width: 760px; margin: 0 auto; padding: 24px 22px 80px; }
  .ind-qsec { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin: 26px 0 10px; }
  .ind-q { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }
  .ind-q.answered { border-color: rgba(109,184,81,0.45); }
  .ind-q .qt { font-size: 14.5px; font-weight: 500; line-height: 1.5; }
  .ind-q .qn { color: var(--text-3); font-weight: 700; margin-right: 6px; }
  .ind-q .qm { font-size: 11.5px; color: var(--text-3); margin-left: 6px; }
  .ind-opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-top: 8px; border: 1px solid var(--border-2); border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .ind-opt:hover { background: var(--surface-2); }
  .ind-opt input { margin: 2px 0 0; accent-color: var(--leaf); width: 16px; height: 16px; flex: 0 0 auto; }
  .ind-opt.sel { border-color: var(--leaf); background: rgba(109,184,81,0.08); }
  .ind-res { max-width: 560px; margin: 0 auto; padding: 60px 24px; text-align: center; }
  .ind-res .pct { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; }
  .ind-res .pct.pass { color: var(--leaf-ink); }
  .ind-res .pct.fail { color: var(--red); }
  .ind-res .ind-secs { text-align: left; margin: 24px 0; }
  .ind-res p { color: var(--text-2); line-height: 1.6; }

  .ind-vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .ind-vcard { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; padding: 0; color: var(--text); font: inherit; }
  .ind-vcard:hover { border-color: var(--hover-bd); }
  .ind-vthumb { position: relative; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; }
  .ind-vthumb .play { position: absolute; inset: 0; margin: auto; width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; color: #fff; }
  .ind-vthumb .play svg { width: 20px; height: 20px; margin-left: 3px; }
  .ind-vthumb .done { position: absolute; top: 8px; right: 8px; }
  .ind-vthumb .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,0.2); }
  .ind-vthumb .prog div { height: 100%; background: var(--leaf-grad); }
  .ind-vcard .vt { padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 1.4; }
  .ind-vcard .vt small { display: block; font-weight: 500; color: var(--text-3); font-size: 11.5px; margin-top: 3px; }
  .ind-vid { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--leaf-ink); margin-right: 6px; }
  .ind-docs { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .ind-doc { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .ind-doc:last-child { border-bottom: none; }
  .ind-doc:hover { background: var(--surface-2); }
  .ind-doc .id { font-size: 11px; font-weight: 700; color: var(--leaf-ink); }
  .ind-doc .tt { font-size: 13.5px; font-weight: 500; }
  .ind-doc .go { font-size: 12px; font-weight: 600; color: var(--leaf-ink); white-space: nowrap; }
  .ind-lib-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .ind-lib-head .tabs { border-bottom: none; margin-bottom: 0; }
  .ind-lib-head .inp { width: 260px; max-width: 100%; height: 32px; margin-bottom: 6px; }
  .ind-player .frame.doc { aspect-ratio: auto; height: 78vh; background: #fff; }
  .ind-vsec { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin: 18px 0 10px; }
  .ind-watch { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid rgba(155,203,74,0.5); background: transparent; color: var(--leaf-ink); font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .ind-watch.seen { border-color: var(--border-2); color: var(--text-2); }
  .ind-watch svg { width: 11px; height: 11px; }
  .ind-player { position: fixed; inset: 0; z-index: 4700; background: rgba(0,0,0,0.82); display: none; align-items: center; justify-content: center; padding: 20px; }
  .ind-player.show { display: flex; }
  .ind-player .box { width: 100%; max-width: 1000px; }
  .ind-player .head { display: flex; align-items: center; gap: 12px; color: #fff; margin-bottom: 10px; }
  .ind-player .head .t { flex: 1 1 auto; font-weight: 600; font-size: 15px; min-width: 0; }
  .ind-player .head .t small { display: block; font-weight: 500; font-size: 12px; color: #b9bcc1; }
  .ind-player .head a, .ind-player .head button { color: #fff; }
  .ind-player .frame { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
  .ind-player .frame > div, .ind-player .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .ind-player .foot { color: #b9bcc1; font-size: 12px; margin-top: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  @media (max-width: 900px) { .ind-hero { grid-template-columns: 1fr; } .ind-wel .phases { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .ind-item { grid-template-columns: 26px minmax(0, 1fr); } .ind-meta { grid-column: 2; justify-content: flex-start; } .ind-tbar { padding: 10px 14px; } }
</style>

<!-- Welcome (first sign-in) -->
<div class="ind-full" id="indWelcome"><div class="ind-wel" id="indWelBody"></div></div>
<!-- The assessment -->
<div class="ind-full" id="indTest">
  <div class="ind-tbar" id="indTbar">
    <div class="ttl" id="indTtl">Induction assessment<small id="indTsub"></small></div>
    <div class="ind-timer" id="indTimer">--:--</div>
    <button class="btn primary" type="button" id="indSubmit">Submit</button>
  </div>
  <div id="indTestBody"></div>
</div>

<!-- Video pop-up -->
<div class="ind-player" id="indPlayer"><div class="box">
  <div class="head"><div class="t" id="indPlTitle"></div>
    <a class="btn ghost sm" id="indPlYt" href="#" target="_blank" rel="noopener">Open on YouTube ↗</a>
    <button class="btn ghost icon-btn" type="button" id="indPlClose" title="Close (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="frame" id="indPlFrame"></div>
  <div class="foot"><span id="indPlProg"></span><button class="btn sm" type="button" id="indPlManual" style="display:none;">I've watched it</button></div>
</div></div>

<script>
(function () {
  'use strict';
  var C = window.ICF_CRE;
  if (!C) { if (window.ICF_BETA_ERR) window.ICF_BETA_ERR('induction_cre: the CRE page helpers are missing.'); return; }
  var $ = C.$, esc = C.esc;
  function errText(e) { return C.errText(e); }
  function pill(text, tone) { return '<span class="pill t-' + tone + '"><span class="dot"></span>' + esc(text) + '</span>'; }
  var ICON_TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5 10 17l9-10"/></svg>';
  var ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>';

  var ME = null;          // indGetMine result
  var TEST = null;        // running test: { attemptId, questions, answers, deadlineMs, skew, dirty }
  var timerId = null, saveId = null;

  // ---------- Rail button + view (added only once someone is in induction) ----------
  var railBtn = null, view = null;
  function setMode(enrolled) {
    var tip = railBtn.querySelector('.rail-tip'); if (tip) tip.textContent = enrolled ? 'Induction' : 'Training';
    view.querySelector('.page-title').textContent = enrolled ? 'Induction' : 'Training Material';
  }
  function ensureShell() {
    if (railBtn) return;
    railBtn = document.createElement('button');
    railBtn.className = 'rail-btn'; railBtn.type = 'button';
    railBtn.setAttribute('data-view', 'induction'); railBtn.setAttribute('data-go', 'induction');
    railBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 9 12 4l10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>' +
      '<span class="count hot" id="indRailCount" style="display:none;">0</span><span class="rail-tip">Induction</span>';
    var rail = document.querySelector('.rail');
    var grow = rail && rail.querySelector('.rail-grow');
    if (rail) rail.insertBefore(railBtn, grow || null);
    view = document.createElement('section');
    view.className = 'view'; view.id = 'view-induction';
    view.innerHTML = '<div class="page-head"><div><h1 class="page-title">Induction</h1><div class="page-sub" id="indSub">Loading…</div></div>' +
      '<button class="btn" type="button" id="indRefresh">&#8635; Refresh</button></div><div id="indOut"><div class="loading">Loading…</div></div>';
    var main = document.querySelector('main.main');
    if (main) main.appendChild(view);
    railBtn.addEventListener('click', function () { load(); });
    $('indRefresh').addEventListener('click', function () { load(); });
  }
  function hideShell() { if (railBtn) railBtn.style.display = 'none'; }

  // ---------- Load ----------
  function load(after) {
    window.authRun()
      .withSuccessHandler(function (res) {
        ME = res;
        if (!res || (!res.enrolled && !(res.videos && res.videos.length) && !(res.material && res.material.length))) { hideShell(); return; }
        ensureShell(); railBtn.style.display = ''; setMode(res.enrolled);
        if (!res.enrolled) { renderLibraryOnly(); return; }
        render();
        if (!res.welcomeSeen) showWelcome();
        if (after) after(res);
      })
      .withFailureHandler(function (e) { if (view) $('indOut').innerHTML = '<div class="note bad">' + esc(errText(e)) + '</div>'; })
      .indGetMine();
  }
  document.addEventListener('icf-signed-in', function (e) { if ((e.detail || {}).role === 'CRE' || (e.detail || {}).role === 'Admin') load(); });
  if (window.ICF_STAFF) load();

  var prevClear = window.ICF_CLEAR;
  window.ICF_CLEAR = function () {
    stopTimers(); TEST = null; ME = null;
    $('indWelcome').classList.remove('show'); $('indTest').classList.remove('show'); closePlayer();
    hideShell();
    if (view) $('indOut').innerHTML = '';
    if (typeof prevClear === 'function') prevClear();
  };

  // ---------- Helpers ----------
  function weekOf(day) { return Math.max(1, Math.ceil(day / 7)); }
  function dueCount(m) {
    var wk = weekOf(m.day);
    var n = m.items.filter(function (i) { return i.status === 'todo' && i.week <= wk; }).length;
    if (m.test.state === 'open' || m.test.state === 'retakeOpen' || m.test.state === 'inProgress') n++;
    return n;
  }
  function secHtml(sections) {
    return '<div class="ind-secs">' + (sections || []).map(function (s) {
      var tone = s.pending ? '' : (s.pct >= ME.test.passPct ? '' : (s.pct >= 50 ? ' amber' : ' red'));
      return '<div class="ind-sec"><div class="row"><span>' + esc(s.section) + '</span><span class="mono">' + s.score + ' / ' + s.max +
        (s.pending ? ' <span class="faint">(+' + s.pending + ' being marked)</span>' : ' · ' + s.pct + '%') + '</span></div>' +
        '<div class="ind-bar' + tone + '"><div style="width:' + Math.min(100, s.max ? s.score / s.max * 100 : 0) + '%"></div></div></div>';
    }).join('') + '</div>';
  }

  // ---------- Render the view ----------
  function render() {
    var m = ME;
    var cnt = dueCount(m);
    $('indRailCount').textContent = cnt; $('indRailCount').style.display = cnt ? '' : 'none';
    var phaseTxt = m.day > m.totalDays ? 'Induction period complete' : (m.phase === 1 ? 'Phase 1 · Learn (days 1–30)' : 'Phase 2 · Perform (days 31–60)');
    $('indSub').textContent = 'Joined ' + m.joinLabel + ' · ' + phaseTxt;

    var done = m.items.filter(function (i) { return i.status === 'done' || i.status === 'signed'; }).length;
    var waiting = m.items.filter(function (i) { return i.status === 'waiting'; }).length;
    var dayPct = Math.min(100, Math.max(0, (m.day - 1) / m.totalDays * 100));
    var testDay = m.test.opensOn && m.joinYmd ? Math.round((new Date(m.test.opensOn) - new Date(m.joinYmd)) / 86400000) + 1 : 28;
    var testPos = Math.min(100, Math.max(0, (testDay - 1) / m.totalDays * 100));

    var html = '<div class="ind-hero"><div class="ind-card">' +
      '<div class="ind-sub">Your induction</div>' +
      '<div class="ind-big">Day ' + Math.min(m.day, m.totalDays) + '<small>of ' + m.totalDays + '</small></div>' +
      '<div class="ind-line"><div class="fill" style="width:' + dayPct + '%"></div>' +
        '<div class="mk start" style="left:0"><span>Joined</span></div>' +
        '<div class="mk" style="left:' + testPos + '%"><span>Assessment</span></div>' +
        '<div class="mk end" style="left:calc(100% - 2px)"><span>Day 60</span></div></div>' +
      '<div class="ind-stats"><div><b>' + done + ' / ' + m.items.length + '</b>checklist done</div>' +
        (waiting ? '<div><b>' + waiting + '</b>waiting for sign-off</div>' : '') +
        '<div><b>' + esc(m.checkpoint.dueLabel) + '</b>day-60 review</div></div>' +
      '</div>' + testCard(m) + '</div>';

    if (m.revision && m.revision.length && (m.test.state === 'retakeLocked' || m.test.state === 'retakeOpen')) {
      var titles = m.items.filter(function (i) { return m.revision.indexOf(i.id) !== -1; }).map(function (i) { return esc(i.title); });
      html += '<div class="note ind-rev"><b>Revise before your retake:</b> ' + (titles.length ? titles.join(' · ') : 'the sections where you scored lowest') + '. These are marked in the checklist below.</div>';
    }

    var wkNow = weekOf(m.day);
    [1, 2].forEach(function (ph) {
      var items = m.items.filter(function (i) { return i.phase === ph; });
      if (!items.length) return;
      html += '<div class="ind-phase">' + (ph === 1 ? 'Phase 1 · Learn' : 'Phase 2 · Perform') + '<span>' + (ph === 1 ? 'Days 1–30' : 'Days 31–60') + '</span></div>';
      var weeks = {};
      items.forEach(function (i) { (weeks[i.week] = weeks[i.week] || []).push(i); });
      Object.keys(weeks).sort(function (a, b) { return a - b; }).forEach(function (w) {
        w = Number(w);
        html += '<div class="ind-week"><h4>Week ' + w + (w === wkNow ? ' <span class="now">· this week</span>' : '') + '</h4>' +
          weeks[w].map(function (i) { return itemHtml(i, w < wkNow, m.revision.indexOf(i.id) !== -1); }).join('') + '</div>';
      });
    });
    if ((m.videos && m.videos.length) || (m.docs && m.docs.length)) html += '<div class="ind-phase">Training Material</div>' + libShell();
    $('indOut').innerHTML = html;
    bindView();
    renderLib();
  }

  // ---------- Library: tabs (Videos | Documents | Material) + search ----------
  var libTab = '', libQ = '';
  // Two tabs (Hari, 6 Nov 2026): Read = documents + the checklist's reading topics (existing CREs only --
  // trainees have the checklist itself); Watch = videos. Checklist items of type Watch aren't listed:
  // their videos are under Watch.

  function docById(id) { return ((ME && ME.docs) || []).filter(function (d) { return d.id === id; })[0]; }

  function materialItemHtml(i) {

  function renderLibraryOnly() {
    $('indSub').textContent = 'Reference material on ICF’s products and processes – the same material new CREs learn in their induction.';

  function bindVideos(root) {

    });
  }
  function ytId(link) {
    var m = String(link || '').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : '';
  }

  // The player. Counts seconds actually played (seeking ahead doesn't count); 90% = watched.
  var PL = null; // { v, yt, player, seen:{}, dur, lastT, sentPct, poll, untracked }
  var apiState = 0; // 0 not loaded, 1 loading, 2 ready
  var apiWaiters = [];
  function withYtApi(ok, fail) {
    if (apiState === 2) return ok();
    apiWaiters.push(ok);
    if (apiState === 1) return;
    apiState = 1;
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () { apiState = 2; if (prev) try { prev(); } catch (e) {} var w = apiWaiters; apiWaiters = []; w.forEach(function (f) { f(); }); };
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = function () { apiState = 0; apiWaiters = []; fail(); };
    document.head.appendChild(s);
    setTimeout(function () { if (apiState !== 2) { apiWaiters = []; apiState = 0; fail(); } }, 8000);
  }
  function openVideo(id, link, title) {
    closePlayer();
    var v = id ? videoById(id) : null;
    var yt = v ? v.yt : ytId(link);
    if (!yt) { if (link) window.open(link, '_blank'); return; }
    $('indPlFrame').classList.remove('doc'); $('indPlYt').textContent = 'Open on YouTube ↗';
    PL = { v: v, yt: yt, seen: {}, dur: 0, lastT: null, sentPct: v ? v.pct : 0, untracked: !v };
    $('indPlTitle').innerHTML = esc(v ? v.title : (title || 'Video')) + (v ? '<small>' + esc(v.section) + (v.minutes ? ' · ' + v.minutes + ' min' : '') + '</small>' : '');
    $('indPlYt').href = 'https://www.youtube.com/watch?v=' + yt;
    $('indPlManual').style.display = 'none';
    $('indPlProg').textContent = v ? (v.watched ? 'Watched ✓' : (v.pct ? 'Watched so far: ' + v.pct + '%' : 'Counts as watched at ' + ME.watchedPct + '%')) : '';
    $('indPlFrame').innerHTML = '<div id="indPlMount"></div>';
    $('indPlayer').classList.add('show');
    if (v) report(v.id, v.pct, true);
    var mine = PL;
    withYtApi(function () {
      if (PL !== mine) return;
      PL.player = new YT.Player('indPlMount', {
        videoId: yt, host: 'https://www.youtube-nocookie.com',
        playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
        events: { onStateChange: function (e) { if (PL === mine && (e.data === 2 || e.data === 0)) { sample(); flush(e.data === 0); } } }
      });
      PL.poll = setInterval(function () { if (PL === mine) sample(); }, 1000);
    }, function () {
      if (PL !== mine) return;
      // The YouTube script couldn't load: plain player, and the CRE confirms when done.
      $('indPlFrame').innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + yt + '?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      if (v && !v.watched) {
        var wait = Math.max(1, Math.round((v.minutes || 3) * 0.8));
        $('indPlProg').textContent = 'Progress can’t be tracked here. The button below unlocks after ' + wait + ' min.';
        setTimeout(function () { if (PL === mine) $('indPlManual').style.display = ''; }, wait * 60000);
      }
    });
  }
  function sample() {
    var p = PL && PL.player;
    if (!p || typeof p.getCurrentTime !== 'function' || !PL.v) return;
    var d = p.getDuration ? p.getDuration() : 0; if (d > 0) PL.dur = d;
    var t = p.getCurrentTime() || 0;
    var playing = p.getPlayerState && p.getPlayerState() === 1;
    if (playing && PL.lastT !== null && t > PL.lastT && t - PL.lastT <= 2.5) {
      for (var s = Math.floor(PL.lastT); s < Math.floor(t); s++) PL.seen[s] = 1;
    }
    PL.lastT = t;
    if (!PL.dur) return;
    var pct = Math.min(100, Math.round(Object.keys(PL.seen).length / Math.floor(PL.dur) * 100));
    if (pct > (PL.best || 0)) PL.best = pct;
    var shown = Math.max(PL.best || 0, PL.v.pct || 0);
    if (!PL.v.watched) $('indPlProg').textContent = shown >= ME.watchedPct ? 'Watched ✓' : 'Watched so far: ' + shown + '% · counts as watched at ' + ME.watchedPct + '%';
    if ((PL.best || 0) - (PL.sentPct || 0) >= 10 || ((PL.best || 0) >= ME.watchedPct && (PL.sentPct || 0) < ME.watchedPct)) flush();
  }
  function flush() {
    if (!PL || !PL.v || !PL.best || PL.best <= (PL.sentPct || 0)) return;
    PL.sentPct = PL.best;
    report(PL.v.id, PL.best, false);
  }
  function report(id, pct, opened) {
    var v = videoById(id);

    window.authRun().withSuccessHandler(function (r) { if (r && r.watched) needsRefresh = true; })
      .withFailureHandler(function () {}).indVideoProgress({ videoId: id, pct: pct, opened: !!opened });
  }
  var needsRefresh = false;
  function closePlayer() {
    if (!PL) return;

    try { if (PL.player && PL.player.destroy) PL.player.destroy(); } catch (e) {}

  function testCard(m) {

      '</div>' +
      '<p>Your checklist is under <b>Induction</b> on the left. Tick items as you finish them; practical ones are confirmed by the admin. Items with a <b>Watch</b> button have training videos – they play right here, and the item ticks itself once you have watched them.</p>' +
      '<div class="rule"><b>The assessment – please read</b><ul>' +
        '<li>Around day 30 (opens <b>' + esc(m.test.opensLabel) + '</b>) you take a ' + m.test.durationMin + '-minute assessment on what Phase 1 covers.</li>' +
        '<li>The pass mark is <b>' + m.test.passPct + '%</b>. You see your score as soon as you submit.</li>' +
        '<li>If you score below ' + m.test.passPct + '%, you get one retake about ' + m.retakeGapDays + ' days later.</li>' +
        '<li>If the retake is also below ' + m.test.passPct + '%, the directors will review your salary with you.</li>' +
        '<li>At day 60 you and Ananthu go through a review of your work.</li></ul></div>' +
      '<label class="check" style="margin-top:18px;"><input type="checkbox" id="indWelOk"> I have read this, including how the assessment works.</label>' +
      '<div style="margin-top:18px;"><button class="btn primary" type="button" id="indWelGo" disabled>Start my induction</button></div>' +
      '<div class="err" id="indWelErr"></div>';
    $('indWelcome').classList.add('show');
    $('indWelOk').addEventListener('change', function () { $('indWelGo').disabled = !this.checked; });
    $('indWelGo').addEventListener('click', function () {
      var b = $('indWelGo'); C.busy(b, 'Saving…');
      window.authRun().withSuccessHandler(function () {
        $('indWelcome').classList.remove('show'); ME.welcomeSeen = true;
        if (railBtn) railBtn.click();
      }).withFailureHandler(function (e) { C.unbusy(b); C.showErr($('indWelErr'), errText(e)); }).indAckWelcome();
    });
  }

  // ---------- The assessment ----------
  function stopTimers() { if (timerId) clearInterval(timerId); if (saveId) clearInterval(saveId); timerId = saveId = null; }
  function onLeave(e) { if (TEST && !TEST.submitting) { e.preventDefault(); e.returnValue = ''; } }
  window.addEventListener('beforeunload', onLeave);

  function openTest(res) {
    TEST = { attemptId: res.attemptId, questions: res.questions, answers: res.saved || {}, deadlineMs: res.deadlineMs,
      skew: (res.serverNowMs || Date.now()) - Date.now(), dirty: false, submitting: false };
    $('indTsub').textContent = 'Attempt ' + res.attemptNo + ' · ' + res.questions.length + ' questions · pass mark ' + ME.test.passPct + '%' + (res.resumed ? ' · resumed' : '');
    $('indTbar').style.display = '';
    var html = '<div class="ind-qs">', lastSec = '';
    res.questions.forEach(function (q, n) {
      if (q.section !== lastSec) { html += '<div class="ind-qsec">' + esc(q.section) + '</div>'; lastSec = q.section; }
      var a = TEST.answers[q.qid] || '';
      html += '<div class="ind-q' + (a ? ' answered' : '') + '" id="indQ_' + esc(q.qid) + '"><div class="qt"><span class="qn">' + (n + 1) + '.</span>' + esc(q.text) +
        (q.marks > 1 ? '<span class="qm">' + q.marks + ' marks</span>' : '') + '</div>';
      if (q.type === 'Short') {
        html += '<textarea class="inp" rows="4" style="margin-top:10px;" data-q="' + esc(q.qid) + '" placeholder="Your answer">' + esc(a) + '</textarea>';
      } else {
        q.options.forEach(function (o) {
          var sel = a === o.key;
          html += '<label class="ind-opt' + (sel ? ' sel' : '') + '"><input type="radio" name="iq_' + esc(q.qid) + '" value="' + esc(o.key) + '" data-q="' + esc(q.qid) + '"' + (sel ? ' checked' : '') + '>' +
            '<span>' + (q.type === 'MCQ' ? '<b>' + esc(o.key) + ')</b> ' : '') + esc(o.text) + '</span></label>';
        });
      }
      html += '</div>';
    });
    html += '<div style="margin-top:22px;"><button class="btn primary block" type="button" id="indSubmit2">Submit my answers</button></div></div>';
    $('indTestBody').innerHTML = html;
    $('indTest').classList.add('show'); $('indTest').scrollTop = 0;

    C.each($('indTestBody').querySelectorAll('input[type=radio]'), function (r) {
      r.addEventListener('change', function () {
        var qid = r.getAttribute('data-q');
        TEST.answers[qid] = r.value; TEST.dirty = true;
        var box = $('indQ_' + qid); box.classList.add('answered');
        C.each(box.querySelectorAll('.ind-opt'), function (l) { l.classList.toggle('sel', l.querySelector('input').checked); });
        updateCount();
      });
    });
    C.each($('indTestBody').querySelectorAll('textarea'), function (t) {
      t.addEventListener('input', function () {
        var qid = t.getAttribute('data-q');
        TEST.answers[qid] = t.value; TEST.dirty = true;
        $('indQ_' + qid).classList.toggle('answered', !!t.value.trim());
        updateCount();
      });
    });
    $('indSubmit2').addEventListener('click', function () { submit(false); });
    updateCount(); tick();
    stopTimers();
    timerId = setInterval(tick, 1000);
    saveId = setInterval(autosave, 20000);
  }
  $('indSubmit').addEventListener('click', function () { submit(false); });

  function answeredCount() { return TEST.questions.filter(function (q) { return String(TEST.answers[q.qid] || '').trim(); }).length; }
  function updateCount() { $('indTsub').textContent = $('indTsub').textContent.replace(/ · \d+ answered$/, '') + ' · ' + answeredCount() + ' answered'; }

  function tick() {
    if (!TEST) return;
    var left = Math.max(0, Math.round((TEST.deadlineMs - (Date.now() + TEST.skew)) / 1000));
    var el = $('indTimer');
    el.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
    el.classList.toggle('warn', left <= 300 && left > 60);
    el.classList.toggle('crit', left <= 60);
    if (left <= 0 && !TEST.submitting) submit(true);
  }
  function autosave() {
    if (!TEST || !TEST.dirty || TEST.submitting) return;
    TEST.dirty = false;
    window.authRun().withSuccessHandler(function () {}).withFailureHandler(function () { if (TEST) TEST.dirty = true; })
      .indSaveAnswers({ attemptId: TEST.attemptId, answers: TEST.answers });
  }

  function submit(timeUp) {
    if (!TEST || TEST.submitting) return;
    if (!timeUp) {
      var missing = TEST.questions.length - answeredCount();
      if (!confirm(missing ? missing + ' question(s) are unanswered. Submit anyway?\n\nYou cannot change your answers after submitting.' : 'Submit your answers? You cannot change them after submitting.')) return;
    }
    TEST.submitting = true;
    stopTimers();
    $('indSubmit').disabled = true;
    var b2 = $('indSubmit2'); if (b2) C.busy(b2, 'Submitting…');
    window.authRun()
      .withSuccessHandler(function (res) { var t = TEST; TEST = null; showResult(res, timeUp, t); })
      .withFailureHandler(function (e) {
        TEST.submitting = false; $('indSubmit').disabled = false; if (b2) C.unbusy(b2);
        timerId = setInterval(tick, 1000); saveId = setInterval(autosave, 20000);
        alert('Could not submit: ' + errText(e) + '\n\nYour answers are still here. Try again.');
      })
      .indSubmitTest({ attemptId: TEST.attemptId, answers: TEST.answers });
  }

  function showResult(res, timeUp) {
    $('indSubmit').disabled = false;
    $('indTbar').style.display = 'none';
    $('indTestBody').innerHTML = '<div class="ind-res"><div class="loading">Getting your result…</div></div>';
    $('indTest').scrollTop = 0;
    load(function (m) {
      var pass = res.result === 'Pass', pending = res.result === 'Pending marking';
      var msg;
      if (pending) msg = 'Your multiple-choice answers are scored. Your short answers are being marked by the admin, and your final score will appear on your induction page.';
      else if (pass) msg = 'You passed. Well done – keep going with your checklist.';
      else if (m.test.state === 'retakeLocked' || m.test.state === 'retakeOpen') msg = 'Below the ' + m.test.passPct + '% pass mark. Your retake opens on ' + m.test.retakeLabel + '. Your induction page shows what to revise.';
      else msg = 'Below the ' + m.test.passPct + '% pass mark. The directors will meet you to discuss the next steps.';
      $('indTestBody').innerHTML = '<div class="ind-res">' +
        (timeUp || res.late ? '<div class="note">Time ran out – your saved answers were submitted.</div>' : '') +
        '<div class="ind-sub" style="margin-top:14px;">' + (pending ? 'Score so far' : 'Your score') + '</div>' +
        '<div class="pct ' + (pending ? '' : pass ? 'pass' : 'fail') + '">' + (pending ? res.score + ' / ' + res.max : res.pct + '%') + '</div>' +
        '<p>' + esc(msg) + '</p>' + secHtml(res.sections) +
        '<button class="btn primary" type="button" id="indResClose">Back to my induction</button></div>';
      $('indResClose').addEventListener('click', function () { $('indTest').classList.remove('show'); if (railBtn) railBtn.click(); });
    });
  }
})();
</script>
